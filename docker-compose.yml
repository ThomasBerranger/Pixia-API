services:
    mysql:
        image: mysql:8.0
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: pixia
        volumes:
            - mysql_data:/var/lib/mysql

    php:
        image: php:8.3-fpm
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql

volumes:
    mysql_data:

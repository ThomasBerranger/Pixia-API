framework:
    rate_limiter:
        global_api:
            policy: 'sliding_window'
            limit: 300
            interval: '1 hour'

        game_answer:
            policy: 'token_bucket'
            limit: 50
            rate:
                interval: '10 minutes'
                amount: 50

        auth_form:
            policy: 'fixed_window'
            limit: 30
            interval: '24 hours'

name: Daily database backup

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Debug — présence des secrets (longueurs, pas de valeurs)
        env:
          BACKUP_DB_HOST: ${{ secrets.BACKUP_DB_HOST }}
          BACKUP_DB_PORT: ${{ secrets.BACKUP_DB_PORT }}
          BACKUP_DB_USER: ${{ secrets.BACKUP_DB_USER }}
          BACKUP_DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
          BACKUP_DB_NAME: ${{ secrets.BACKUP_DB_NAME }}
        run: |
          echo "HOST len:     ${#BACKUP_DB_HOST}"
          echo "PORT len:     ${#BACKUP_DB_PORT}"
          echo "USER len:     ${#BACKUP_DB_USER}"
          echo "PASSWORD len: ${#BACKUP_DB_PASSWORD}"
          echo "NAME len:     ${#BACKUP_DB_NAME}"

      - name: Dump database
        env:
          BACKUP_DB_HOST: ${{ secrets.BACKUP_DB_HOST }}
          BACKUP_DB_PORT: ${{ secrets.BACKUP_DB_PORT }}
          BACKUP_DB_USER: ${{ secrets.BACKUP_DB_USER }}
          BACKUP_DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
          BACKUP_DB_NAME: ${{ secrets.BACKUP_DB_NAME }}
        run: |
          FILENAME="pixia-$(date -u +%Y-%m-%d).sql"
          docker run --rm \
            -e MYSQL_PWD="$BACKUP_DB_PASSWORD" \
            mysql:9.4 \
            mysqldump \
              --host="$BACKUP_DB_HOST" \
              --port="$BACKUP_DB_PORT" \
              --user="$BACKUP_DB_USER" \
              --single-transaction \
              --quick \
              --no-tablespaces \
              --set-gtid-purged=OFF \
              --default-character-set=utf8mb4 \
              "$BACKUP_DB_NAME" \
            | gzip > "$FILENAME.gz"
          echo "BACKUP_FILE=$FILENAME.gz" >> "$GITHUB_ENV"

      - name: Sanity check
        run: |
          test -s "$BACKUP_FILE" || { echo "Backup file is empty"; exit 1; }
          ls -lh "$BACKUP_FILE"
          if ! gunzip -c "$BACKUP_FILE" | grep -q "CREATE TABLE"; then
            echo "::error::Le dump ne contient aucun CREATE TABLE — base vide, mauvais nom de base ou privilèges insuffisants."
            echo "----- début du dump (debug) -----"
            gunzip -c "$BACKUP_FILE" | head -40
            echo "----- fin du dump (debug) -----"
            exit 1
          fi

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Notify on failure via Brevo
        if: failure()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_EMAIL: ${{ secrets.BACKUP_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -X POST https://api.brevo.com/v3/smtp/email \
            -H "accept: application/json" \
            -H "api-key: $BREVO_API_KEY" \
            -H "content-type: application/json" \
            -d "{
              \"sender\": {\"name\": \"Pixia Backup\", \"email\": \"no-reply@pixia.fun\"},
              \"to\": [{\"email\": \"$ALERT_EMAIL\"}],
              \"subject\": \"Pixia backup failed\",
              \"htmlContent\": \"<p>Le backup quotidien de la base MySQL a échoué.</p><p><a href=\\\"$RUN_URL\\\">Voir le run GitHub Actions</a></p>\"
            }"

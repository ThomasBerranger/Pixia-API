name: Daily database backup

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Dump database
        env:
          MYSQL_PWD: ${{ secrets.BACKUP_DB_PASSWORD }}
        run: |
          FILENAME="pixia-$(date -u +%Y-%m-%d).sql"
          mysqldump \
            --host="${{ secrets.BACKUP_DB_HOST }}" \
            --port="${{ secrets.BACKUP_DB_PORT }}" \
            --user="${{ secrets.BACKUP_DB_USER }}" \
            --single-transaction \
            --quick \
            --no-tablespaces \
            --set-gtid-purged=OFF \
            --default-character-set=utf8mb4 \
            "${{ secrets.BACKUP_DB_NAME }}" \
            | gzip > "$FILENAME.gz"
          echo "BACKUP_FILE=$FILENAME.gz" >> "$GITHUB_ENV"

      - name: Sanity check
        run: |
          test -s "$BACKUP_FILE" || { echo "Backup file is empty"; exit 1; }
          ls -lh "$BACKUP_FILE"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Notify on failure via Brevo
        if: failure()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_EMAIL: ${{ secrets.BACKUP_ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -X POST https://api.brevo.com/v3/smtp/email \
            -H "accept: application/json" \
            -H "api-key: $BREVO_API_KEY" \
            -H "content-type: application/json" \
            -d "{
              \"sender\": {\"name\": \"Pixia Backup\", \"email\": \"no-reply@pixia.fun\"},
              \"to\": [{\"email\": \"$ALERT_EMAIL\"}],
              \"subject\": \"Pixia backup failed\",
              \"htmlContent\": \"<p>Le backup quotidien de la base MySQL a échoué.</p><p><a href=\\\"$RUN_URL\\\">Voir le run GitHub Actions</a></p>\"
            }"
